<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURA — The Full Collection</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />

  <style>
    /* WebGL Canvas Background Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Cart Drawer Styles */
    .cart-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 999;
    }

    .cart-drawer-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 100%;
      max-width: 380px;
      height: 100vh;
      background: var(--dark-card-bg, #0d0a18);
      border-left: 1px solid var(--glass-border, rgba(255, 255, 255, 0.18));
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .cart-drawer.active {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border, rgba(255, 255, 255, 0.18));
      padding-bottom: 16px;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
    }

    .cart-footer {
      border-top: 1px solid var(--glass-border, rgba(255, 255, 255, 0.18));
      padding-top: 16px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .empty-msg {
      color: var(--text-muted, rgba(255, 255, 255, 0.75));
      text-align: center;
      margin-top: 40px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      width: 90%;
      max-width: 440px;
      padding: 36px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .tab-switcher {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--glass-border, rgba(255, 255, 255, 0.18));
    }

    .tab-switcher button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted, rgba(255, 255, 255, 0.75));
      padding: 12px;
      font-family: var(--font-product, sans-serif);
      font-size: 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-switcher button.active {
      color: var(--text-main, #fff);
      border-bottom-color: var(--accent-gold, #e2c08d);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-muted, rgba(255, 255, 255, 0.75));
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.18));
      background: rgba(0, 0, 0, 0.25);
      color: white;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-gold, #e2c08d);
    }

    .hidden { display: none !important; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- WebGL Canvas Container -->

  <nav class="navbar glass-card">
    <a href="index.html" class="logo">AURA</a>
    
    <div class="nav-links">
      <a href="collection.html" class="active">Collection</a>
    </div>

    <div class="nav-right">

        <button class="btn-glass" onclick="openAuthModal('login')">Sign In</button>
        <button class="btn-primary" onclick="openAuthModal('signup')">Create Account</button>
      </div>
      <button class="cart-icon-btn" onclick="openCartDrawer()">🛒 Cart <span class="cart-count" id="navCartCount">0</span></button>

        </div>
      </div>

      <div class="product-card glass-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=800&q=80" alt="Bespoke Velvet Blazer">
        </div>
        <div class="product-info">
          <h3>Bespoke Velvet Blazer</h3>
          <p class="price">$890</p>
          <button class="btn-glass full-width" onclick="addToCart(2, 'Bespoke Velvet Blazer', 890, 'https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=800&q=80')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card glass-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=800&q=80" alt="Ethereal Evening Gown">
        </div>
        <div class="product-info">
          <h3>Ethereal Evening Gown</h3>
          <p class="price">$2,100</p>
          <button class="btn-glass full-width" onclick="addToCart(3, 'Ethereal Evening Gown', 2100, 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=800&q=80')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card glass-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=80" alt="Monochrome Wool Overcoat">
        </div>
        <div class="product-info">
          <h3>Monochrome Wool Overcoat</h3>
          <p class="price">$1,480</p>
          <button class="btn-glass full-width" onclick="addToCart(4, 'Monochrome Wool Overcoat', 1480, 'https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=80')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card glass-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1550614000-4895a10e1bfd?auto=format&fit=crop&w=800&q=80" alt="Obsidian Biker Jacket">
        </div>
        <div class="product-info">
          <h3>Obsidian Biker Jacket</h3>
          <p class="price">$1,850</p>
          <button class="btn-glass full-width" onclick="addToCart(5, 'Obsidian Biker Jacket', 1850, 'https://images.unsplash.com/photo-1550614000-4895a10e1bfd?auto=format&fit=crop&w=800&q=80')">Add to Cart</button>
        </div>
      </div>

      <div class="product-card glass-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=800&q=80" alt="Midnight Silk Trousers">
        </div>
        <div class="product-info">
          <h3>Midnight Silk Trousers</h3>
          <p class="price">$620</p>
          <button class="btn-glass full-width" onclick="addToCart(6, 'Midnight Silk Trousers', 620, 'https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=800&q=80')">Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content glass-card">
      <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      
      <div class="tab-switcher">
        <button id="loginTab" class="active" onclick="switchTab('login')">Sign In</button>
        <button id="signupTab" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginUsername">Username or Email</label>
          <input type="text" id="loginUsername" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn-primary full-width">Sign In</button>
      </form>

      <form id="signupForm" class="hidden">
        <div class="form-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" required>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" required>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" required>
        </div>
        <button type="submit" class="btn-primary full-width">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer-overlay" id="cartDrawerOverlay" onclick="closeCartDrawer()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Shopping Cart</h3>
      <button class="close-btn" onclick="closeCartDrawer()">&times;</button>
    </div>
    <div class="cart-body" id="cartItemsContainer">
      <p class="empty-msg">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">$0</span>
      </div>
      <button class="btn-primary full-width">Checkout</button>
    </div>
  </div>

  <!-- WebGL Particle Background -->
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const COUNT = 45000;
    const SPEED_MULT = 0.35;
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.strength = 1.8; 
    bloomPass.radius = 0.4; 
    bloomPass.threshold = 0.05;
    composer.addPass(bloomPass);

    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    const target = new THREE.Vector3();

    const geometry = new THREE.ConeGeometry(0.1, 0.5, 4).rotateX(Math.PI / 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00aaff });

    const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
    instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(instancedMesh);

    const positions = [];
    for(let i = 0; i < COUNT; i++) {
      positions.push(new THREE.Vector3((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100));
      instancedMesh.setColorAt(i, color.setHex(0x00ff88));
    }

    // Default Background State set to expanded Collection mode
    window.bgState = {
      scale: 85,
      targetScale: 85,
      twist: 2.4,
      targetTwist: 2.4,
      chaos: 1.1,
      targetChaos: 1.1,
      camX: 0,
      targetCamX: 0
    };

    const mouse = new THREE.Vector2(0, 0);
    const targetRotation = new THREE.Vector2(0, 0);

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime() * SPEED_MULT;

      const state = window.bgState;
      state.scale += (state.targetScale - state.scale) * 0.05;
      state.twist += (state.targetTwist - state.twist) * 0.05;
      state.chaos += (state.targetChaos - state.chaos) * 0.05;
      state.camX += (state.targetCamX - state.camX) * 0.05;

      camera.position.x = state.camX;

      targetRotation.x += (mouse.y * 0.3 - targetRotation.x) * 0.03;
      targetRotation.y += (mouse.x * 0.3 - targetRotation.y) * 0.03;

      instancedMesh.rotation.x = targetRotation.x;
      instancedMesh.rotation.y = targetRotation.y;

      const count = COUNT;
      const golden = 1.618033988749895;

      for(let i = 0; i < COUNT; i++) {
        const theta = i * golden * 6.283185307;
        const phi = Math.acos(1 - 2 * (i + 0.5) / count);
        const radius = state.scale * (0.8 + 0.3 * Math.sin(time * 0.5 + i * 0.001));
        const rWarp = radius + state.chaos * 10 * Math.sin(theta * 3 + phi * 2 + time * 0.7);
        const thetaWarp = theta + state.twist * Math.sin(phi * 4 + time * 0.4);
        
        const x = rWarp * Math.sin(phi) * Math.cos(thetaWarp);
        const y = rWarp * Math.cos(phi);
        const z = rWarp * Math.sin(phi) * Math.sin(thetaWarp);
        
        const gx = x + state.chaos * 2 * Math.sin(y * 0.1 + time * 0.5);
        const gy = y + state.chaos * 1.5 * Math.sin(x * 0.08 + z * 0.06 + time * 0.3);
        const gz = z + state.chaos * 2 * Math.cos(x * 0.07 + y * 0.09 + time * 0.4);
        
        target.set(gx, gy, gz);

        const hue = (0.6 + 0.4 * Math.sin(theta * 0.5 + phi * 0.3 + time * 0.05)) % 1.0;
        const lightness = 0.4 + 0.4 * (0.5 + 0.5 * Math.sin(time * 0.2 + i * 0.0005));
        color.setHSL(hue, 0.85, Math.min(1, Math.max(0.2, lightness)));

        positions[i].lerp(target, 0.1);
        dummy.position.copy(positions[i]);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
        instancedMesh.setColorAt(i, color);
      }

      instancedMesh.instanceMatrix.needsUpdate = true;
      if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;

      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <script src="app.js"></script>
  
  <script>
    function openCartDrawer() {
      document.getElementById('cartDrawer').classList.add('active');
      document.getElementById('cartDrawerOverlay').classList.add('active');
      
      if (window.bgState) {
        window.bgState.targetCamX = -25;
        window.bgState.targetChaos = 1.4;
      }
    }

    function closeCartDrawer() {
      document.getElementById('cartDrawer').classList.remove('active');
      document.getElementById('cartDrawerOverlay').classList.remove('active');
      
      if (window.bgState) {
        window.bgState.targetCamX = 0;
        window.bgState.targetChaos = 1.1;
      }
    }

    function openAuthModal(mode) {
      document.getElementById('authModal').classList.add('active');
      switchTab(mode);
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.remove('active');
    }

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const loginTab = document.getElementById('loginTab');
      const signupTab = document.getElementById('signupTab');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }
  </script>
</body>
</html>
