<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURA — Checkout</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- WebGL Background Container -->
  <div id="canvas-container"></div>

  <!-- Navigation Bar -->
  <nav class="navbar glass-card">
    <a href="index.html" class="logo">AURA</a>
    <div class="nav-links">
      <a href="collection.html">← Back to Collection</a>
    </div>
  </nav>

  <!-- Checkout Container -->
  <main class="checkout-page">
    <div class="checkout-grid">
      
      <!-- Order Summary -->
      <section class="order-summary glass-card">
        <h2>Order Summary</h2>
        <div id="checkoutItems" class="checkout-items-list">
          <!-- Dynamically populated from JS -->
        </div>
        <hr class="divider"/>
        <div class="summary-line">
          <span>Subtotal</span>
          <span id="checkoutSubtotal">$0</span>
        </div>
        <div class="summary-line">
          <span>Shipping</span>
          <span>Complimentary</span>
        </div>
        <div class="summary-line total-line">
          <span>Total</span>
          <span id="checkoutGrandTotal">$0</span>
        </div>
      </section>

      <!-- Billing & Payment Form -->
      <section class="checkout-form-container glass-card">
        <h2>Payment Details</h2>
        <form id="paymentForm" onsubmit="handlePayment(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Aria Vance" required />
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="aria@example.com" required />
          </div>

          <div class="form-group">
            <label>Shipping Address</label>
            <input type="text" placeholder="742 Evergreen Terrace" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" placeholder="New York" required />
            </div>
            <div class="form-group">
              <label>Postal Code</label>
              <input type="text" placeholder="10001" required />
            </div>
          </div>

          <hr class="divider"/>

          <div class="form-group">
            <label>Card Number</label>
            <input type="text" placeholder="•••• •••• •••• ••••" maxLength="19" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Expiry</label>
              <input type="text" placeholder="MM/YY" maxLength="5" required />
            </div>
            <div class="form-group">
              <label>CVC</label>
              <input type="password" placeholder="•••" maxLength="4" required />
            </div>
          </div>

          <button type="submit" class="btn-primary full-width checkout-btn">Complete Purchase</button>
        </form>
      </section>

    </div>
  </main>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Initialize Background Module -->
  <script type="module">
    import { initBackground } from './bg-nebula.js';
    initBackground('canvas-container');
  </script>

  <script src="app.js"></script>
  <script>
    function renderCheckoutSummary() {
      const cart = JSON.parse(localStorage.getItem('auraCart')) || [];
      const container = document.getElementById('checkoutItems');
      const subtotalEl = document.getElementById('checkoutSubtotal');
      const totalEl = document.getElementById('checkoutGrandTotal');

      if (cart.length === 0) {
        container.innerHTML = '<p class="empty-msg">Your cart is empty.</p>';
        subtotalEl.innerText = '$0';
        totalEl.innerText = '$0';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        return `
          <div class="checkout-item">
            <img src="${item.image}" alt="${item.name}" />
            <div class="checkout-item-details">
              <h4>${item.name}</h4>
              <p>Qty: ${item.quantity} × $${item.price.toLocaleString()}</p>
            </div>
            <span class="checkout-item-price">$${itemTotal.toLocaleString()}</span>
          </div>
        `;
      }).join('');

      subtotalEl.innerText = `$${total.toLocaleString()}`;
      totalEl.innerText = `$${total.toLocaleString()}`;
    }

    function handlePayment(e) {
      e.preventDefault();
      alert('Thank you for your order! Your purchase with AURA is complete.');
      localStorage.removeItem('auraCart');
      window.location.href = 'collection.html';
    }

    document.addEventListener('DOMContentLoaded', renderCheckoutSummary);
  </script>
</body>
</html>
